spring:
  application:
    name: llm-gateway-java
  main:
    banner-mode: off

server:
  port: 8000

llm:
  service-name: llm-gateway-java
  # 留空仅内存；生产可指向挂载卷，重启后用量账本与 Run 事件可恢复。
  data-dir: ${LLM_GATEWAY_DATA_DIR:./data}
  # 留空表示不校验调用方；生产环境请设置 GATEWAY_API_KEY。
  api-keys:
    - ${GATEWAY_API_KEY:}
  structured-output-retries: 1

  retry:
    max-retries: 3
    base-delay-millis: 250
    max-delay-millis: 4000
    jitter: 0.2
    retry-statuses: [408, 409, 429, 500, 502, 503, 504]

  circuit-breaker:
    failure-threshold: 5
    cooldown-seconds: 30

  rate-limit:
    enabled: true
    requests-per-minute: 60
    burst: 10

  providers:
    deepseek-openai:
      base-url: ${DEEPSEEK_OPENAI_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_V4_PRO_API_KEY:}
      timeout-seconds: 120
    deepseek-anthropic:
      base-url: ${DEEPSEEK_ANTHROPIC_BASE_URL:https://api.deepseek.com/anthropic}
      api-key: ${DEEPSEEK_V4_FLASH_API_KEY:}
      timeout-seconds: 120

  models:
    deepseek-v4-pro:
      strategy: priority
      routes:
        - provider: deepseek-openai
          model: deepseek-v4-pro
          protocol: openai_responses
    deepseek-v4-flash:
      strategy: priority
      routes:
        - provider: deepseek-anthropic
          model: deepseek-v4-flash
          protocol: anthropic_messages

  pricing:
    deepseek-v4-pro:
      input-per-million: 1.75
      output-per-million: 14
      cached-input-per-million: 0.175
    deepseek-v4-flash:
      input-per-million: 0.25
      output-per-million: 2
      cached-input-per-million: 0.025
